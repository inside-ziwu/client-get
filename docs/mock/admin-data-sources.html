<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>admin/DataSources — V3 UI 原型</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
  .btn { padding: 6px 16px; border-radius: 6px; font-size: 14px; cursor: pointer; transition: all 0.15s; }
  .btn-primary { background: #1677ff; color: white; border: 1px solid #1677ff; }
  .btn-primary:hover { background: #4096ff; }
  .btn-default { background: white; color: #000000d9; border: 1px solid #d9d9d9; }
  .btn-default:hover { border-color: #1677ff; color: #1677ff; }
  .btn-danger { background: white; color: #ff4d4f; border: 1px solid #d9d9d9; }
  .btn-danger:hover { border-color: #ff4d4f; }
  .btn-sm { padding: 2px 10px; font-size: 13px; }
  .input { padding: 6px 12px; border: 1px solid #d9d9d9; border-radius: 6px; font-size: 14px; outline: none; width: 100%; }
  .input:focus { border-color: #1677ff; box-shadow: 0 0 0 2px rgba(22,119,255,0.1); }
  .label { display: block; font-size: 14px; color: #000000d9; margin-bottom: 4px; }
  .label-required::before { content: '*'; color: #ff4d4f; margin-right: 2px; }
  table { border-collapse: collapse; width: 100%; }
  th { background: #fafafa; text-align: left; padding: 10px 14px; font-size: 13px; font-weight: 500; color: #000000d9; border-bottom: 1px solid #f0f0f0; }
  td { padding: 10px 14px; font-size: 13px; border-bottom: 1px solid #f0f0f0; vertical-align: middle; }
  tr:hover td { background: #fafafa; }
  .tag { display: inline-block; padding: 1px 8px; border-radius: 4px; font-size: 12px; }
  .tag-blue { background: #e6f4ff; color: #1677ff; border: 1px solid #91caff; }
  .tag-gray { background: #f5f5f5; color: #595959; border: 1px solid #d9d9d9; }
  .switch { display: inline-flex; align-items: center; width: 40px; height: 20px; border-radius: 10px; cursor: pointer; transition: background 0.2s; position: relative; }
  .switch-on { background: #1677ff; }
  .switch-off { background: #d9d9d9; }
  .switch-thumb { position: absolute; width: 16px; height: 16px; background: white; border-radius: 50%; transition: left 0.2s; box-shadow: 0 1px 4px rgba(0,0,0,.2); }
  .switch-on .switch-thumb { left: 22px; }
  .switch-off .switch-thumb { left: 2px; }
  .drawer { position: fixed; top: 0; right: 0; bottom: 0; background: white; box-shadow: -6px 0 16px rgba(0,0,0,.1); z-index: 60; display: flex; flex-direction: column; }
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 55; }
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 70; display: flex; align-items: center; justify-content: center; }
  .modal-box { background: white; border-radius: 8px; box-shadow: 0 6px 24px rgba(0,0,0,.2); }
</style>
</head>
<body class="bg-slate-100 min-h-screen">

<!-- 侧边导航 -->
<aside class="fixed left-0 top-0 bottom-0 w-56 bg-white border-r border-slate-200 overflow-y-auto z-30">
  <div class="px-5 py-4 border-b border-slate-200">
    <div class="font-semibold text-base text-slate-800">ClientGet</div>
    <div class="text-xs text-slate-500 mt-0.5">平台运营后台</div>
  </div>
  <nav class="py-3 text-sm">
    <div class="px-5 py-1.5 text-xs text-slate-400 uppercase tracking-wider">客户</div>
    <a class="flex items-center px-5 py-2 text-slate-700 hover:bg-slate-50 cursor-pointer">客户管理</a>
    <div class="px-5 py-1.5 mt-2 text-xs text-slate-400 uppercase tracking-wider">采集</div>
    <a class="flex items-center px-5 py-2 bg-blue-50 text-blue-600 border-r-2 border-blue-600 font-medium cursor-pointer">数据源</a>
    <a class="flex items-center px-5 py-2 text-slate-700 hover:bg-slate-50 cursor-pointer">关键词</a>
    <a class="flex items-center px-5 py-2 text-slate-700 hover:bg-slate-50 cursor-pointer">同行公司</a>
    <a class="flex items-center px-5 py-2 text-slate-700 hover:bg-slate-50 cursor-pointer">腾道数据</a>
    <a class="flex items-center px-5 py-2 text-slate-700 hover:bg-slate-50 cursor-pointer">客户数据</a>
    <div class="px-5 py-1.5 mt-2 text-xs text-slate-400 uppercase tracking-wider">营销</div>
    <a class="flex items-center px-5 py-2 text-slate-700 hover:bg-slate-50 cursor-pointer">邮件模板</a>
    <a class="flex items-center px-5 py-2 text-slate-700 hover:bg-slate-50 cursor-pointer">评分模板</a>
    <a class="flex items-center px-5 py-2 text-slate-700 hover:bg-slate-50 cursor-pointer">联系人规则</a>
    <a class="flex items-center px-5 py-2 text-slate-700 hover:bg-slate-50 cursor-pointer">预热规则</a>
    <a class="flex items-center px-5 py-2 text-slate-700 hover:bg-slate-50 cursor-pointer">AI 配置</a>
  </nav>
</aside>

<header class="ml-56 bg-white border-b border-slate-200 px-6 h-14 flex items-center justify-between sticky top-0 z-20">
  <div class="text-sm text-slate-500"><span>采集</span><span class="mx-2">/</span><span class="text-slate-800 font-medium">数据源</span></div>
  <div class="text-sm text-slate-500">admin@platform · 退出</div>
</header>

<main class="ml-56 p-6">
  <div class="flex items-center justify-between mb-4">
    <button class="btn btn-primary" onclick="openCreateSource()">+ 新增数据源</button>
  </div>

  <div class="bg-white rounded-md shadow-sm overflow-hidden">
    <table>
      <thead>
        <tr>
          <th>名称</th>
          <th>类型</th>
          <th>别名编码</th>
          <th>用途</th>
          <th>操作</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td class="font-medium">外贸通</td>
          <td><span class="tag tag-blue">waimao_tong</span></td>
          <td><span class="tag tag-gray">trade_data</span></td>
          <td class="text-slate-500">公司信息直采</td>
          <td>
            <button class="btn btn-default btn-sm mr-2" onclick="openEditSource('外贸通', 'waimao_tong')">编辑</button>
            <button class="btn btn-default btn-sm" onclick="openCredentials('waimao_tong', '外贸通')">凭证</button>
          </td>
        </tr>
        <tr>
          <td class="font-medium">腾道</td>
          <td><span class="tag tag-blue">tendata</span></td>
          <td><span class="tag tag-gray">tendata</span></td>
          <td class="text-slate-500">海外买家反查（Stage 2）</td>
          <td>
            <button class="btn btn-default btn-sm mr-2" onclick="openEditSource('腾道', 'tendata')">编辑</button>
            <button class="btn btn-default btn-sm" onclick="openCredentials('tendata', '腾道')">凭证</button>
          </td>
        </tr>
        <tr>
          <td class="font-medium">励销云</td>
          <td><span class="tag tag-blue">lixiaoyun</span></td>
          <td><span class="tag tag-gray">lixiaoyun</span></td>
          <td class="text-slate-500">搜中国同行（Stage 1）</td>
          <td>
            <button class="btn btn-default btn-sm mr-2" onclick="openEditSource('励销云', 'lixiaoyun')">编辑</button>
            <button class="btn btn-default btn-sm" onclick="openCredentials('lixiaoyun', '励销云')">凭证</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</main>

<!-- ======================== 编辑/新增数据源 Drawer ======================== -->
<div id="source-overlay" class="overlay hidden" onclick="closeSourceDrawer()"></div>
<div id="source-drawer" class="drawer hidden" style="width:580px;">
  <div class="px-6 py-4 border-b border-slate-200 flex items-center justify-between">
    <span id="source-drawer-title" class="font-medium text-base">新增数据源</span>
    <div class="flex gap-2">
      <button class="btn btn-default" onclick="closeSourceDrawer()">取消</button>
      <button class="btn btn-primary">保存</button>
    </div>
  </div>
  <div class="p-6 overflow-y-auto flex-1 space-y-4">
    <div>
      <label class="label label-required">数据源类型</label>
      <input class="input" id="source-type-input" placeholder="waimao_tong">
      <div class="text-xs text-slate-400 mt-1">唯一标识符，创建后不可修改</div>
    </div>
    <div>
      <label class="label label-required">名称</label>
      <input class="input" id="source-name-input" placeholder="外贸通">
    </div>
    <div>
      <label class="label">别名编码</label>
      <input class="input" placeholder="trade_data">
    </div>
    <div>
      <label class="label">用途说明</label>
      <input class="input" placeholder="公司信息搜索">
    </div>
    <div>
      <label class="label">配置 JSON</label>
      <textarea class="input" rows="6" style="font-family:monospace; font-size:13px;" placeholder='{"region":"cn"}'>{}</textarea>
    </div>
  </div>
</div>

<!-- ======================== 凭证管理 Modal ======================== -->
<div id="cred-modal-overlay" class="modal-overlay hidden">
  <div class="modal-box" style="width:760px; max-height:80vh; display:flex; flex-direction:column;">
    <div class="px-6 py-4 border-b border-slate-200 flex items-center justify-between flex-shrink-0">
      <span id="cred-modal-title" class="font-medium text-base">凭证管理 - 外贸通</span>
      <button onclick="closeCredentials()" class="text-slate-400 text-xl leading-none hover:text-slate-600">×</button>
    </div>
    <div class="p-4 overflow-y-auto flex-1">
      <button class="btn btn-primary btn-sm mb-4" onclick="openCreateCredential()">+ 新建凭证</button>
      <table>
        <thead>
          <tr>
            <th>账号编号</th>
            <th>用户名</th>
            <th>状态</th>
            <th>创建时间</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody id="cred-table-body"></tbody>
      </table>
    </div>
  </div>
</div>

<!-- ======================== 新建/编辑凭证 Drawer ======================== -->
<div id="cred-overlay" class="overlay hidden" style="z-index:75;" onclick="closeCredDrawer()"></div>
<div id="cred-drawer" class="drawer hidden" style="width:420px; z-index:80;">
  <div class="px-6 py-4 border-b border-slate-200 flex items-center justify-between">
    <span id="cred-drawer-title" class="font-medium text-base">新建凭证</span>
    <div class="flex gap-2">
      <button class="btn btn-default" onclick="closeCredDrawer()">取消</button>
      <button class="btn btn-primary">保存</button>
    </div>
  </div>
  <div id="cred-drawer-body" class="p-6 overflow-y-auto flex-1 space-y-4"></div>
</div>

<script>
// ===== 数据源 Drawer =====
function openCreateSource() {
  document.getElementById('source-drawer-title').textContent = '新增数据源';
  document.getElementById('source-type-input').disabled = false;
  document.getElementById('source-type-input').value = '';
  document.getElementById('source-name-input').value = '';
  document.getElementById('source-overlay').classList.remove('hidden');
  document.getElementById('source-drawer').classList.remove('hidden');
}
function openEditSource(name, type) {
  document.getElementById('source-drawer-title').textContent = '编辑数据源 - ' + name;
  document.getElementById('source-type-input').value = type;
  document.getElementById('source-type-input').disabled = true;
  document.getElementById('source-name-input').value = name;
  document.getElementById('source-overlay').classList.remove('hidden');
  document.getElementById('source-drawer').classList.remove('hidden');
}
function closeSourceDrawer() {
  document.getElementById('source-overlay').classList.add('hidden');
  document.getElementById('source-drawer').classList.add('hidden');
}

// ===== 凭证 Modal =====
let currentSourceType = '';

const credData = {
  waimao_tong: [
    { account_no: 'acct_001', username: 'admin', is_active: true, created_at: '2026-04-10 09:00' },
  ],
  tendata: [
    { account_no: 'acct_002', username: 'admin', is_active: true, created_at: '2026-04-12 14:30' },
    { account_no: 'acct_003', username: 'admin', is_active: false, created_at: '2026-04-20 10:00' },
  ],
  lixiaoyun: [
    { account_no: 'acct_004', username: 'lixy_user1', is_active: true, created_at: '2026-04-15 11:20' },
  ],
};

function openCredentials(sourceType, sourceName) {
  currentSourceType = sourceType;
  document.getElementById('cred-modal-title').textContent = '凭证管理 - ' + sourceName;
  renderCredTable(sourceType);
  document.getElementById('cred-modal-overlay').classList.remove('hidden');
}
function closeCredentials() {
  document.getElementById('cred-modal-overlay').classList.add('hidden');
}
function renderCredTable(sourceType) {
  const rows = credData[sourceType] || [];
  const tbody = document.getElementById('cred-table-body');
  if (!rows.length) {
    tbody.innerHTML = '<tr><td colspan="5" class="text-center text-slate-400 py-8">暂无凭证</td></tr>';
    return;
  }
  tbody.innerHTML = rows.map(r => `
    <tr>
      <td class="font-mono text-xs">${r.account_no}</td>
      <td>${r.username}</td>
      <td>
        <div class="switch ${r.is_active ? 'switch-on' : 'switch-off'}">
          <div class="switch-thumb"></div>
        </div>
      </td>
      <td class="text-slate-500 text-xs">${r.created_at}</td>
      <td>
        <button class="btn btn-default btn-sm mr-1" onclick="openEditCredential()">编辑</button>
        <button class="btn btn-danger btn-sm">删除</button>
      </td>
    </tr>
  `).join('');
}

// ===== 凭证字段模板（按 source_type 动态渲染）=====
const credFieldTemplates = {
  waimao_tong: (isEdit) => `
    <div>
      <label class="label label-required">Cookie 完整字符串</label>
      <textarea class="input" rows="3" placeholder="粘贴浏览器 Cookie 字符串..."></textarea>
    </div>
    <div>
      <label class="label label-required">签名密钥 secret_key</label>
      <input class="input" type="password" placeholder="••••••••">
    </div>
    <div>
      <label class="label label-required">设备 ID _deviceId</label>
      <input class="input" placeholder="xxxxxxxx-xxxx-xxxx-xxxx">
    </div>
  `,
  tendata: (isEdit) => `
    <div>
      <label class="label label-required">token（Cookie 字段）</label>
      <input class="input" placeholder="从浏览器 Cookie 中 token= 的值">
    </div>
    <div>
      <label class="label label-required">userId（Cookie 字段）</label>
      <input class="input" placeholder="从浏览器 Cookie 中 userId= 的值">
    </div>
    <div>
      <label class="label label-required">JSESSIONID（Cookie 字段）</label>
      <input class="input" placeholder="从浏览器 Cookie 中 JSESSIONID= 的值">
    </div>
  `,
  lixiaoyun: (isEdit) => `
    <div>
      <label class="label label-required">distinct_id（用户 ID）</label>
      <input class="input" placeholder="从浏览器请求头 distinct_id 字段获取">
    </div>
    <div>
      <label class="label ${isEdit ? '' : 'label-required'}">${isEdit ? 'Token（留空则不修改）' : 'Token'}</label>
      <input class="input" type="password" placeholder="Authorization 请求头中 Token token= 后的值">
    </div>
  `,
};

function defaultCredFields(isEdit) {
  return `
    <div>
      <label class="label label-required">用户名</label>
      <input class="input" placeholder="your_username">
    </div>
    <div>
      <label class="label ${isEdit ? '' : 'label-required'}">${isEdit ? '新密码（留空则不修改）' : '密码'}</label>
      <input class="input" type="password" placeholder="••••••••">
    </div>
  `;
}

function statusField() {
  return `
    <div class="flex items-center gap-3 pt-2 border-t border-slate-100">
      <label class="label" style="margin:0;">启用</label>
      <div class="switch switch-on"><div class="switch-thumb"></div></div>
    </div>
  `;
}

function openCreateCredential() {
  document.getElementById('cred-drawer-title').textContent = '新建凭证';
  const tmpl = credFieldTemplates[currentSourceType];
  const fields = tmpl ? tmpl(false) : defaultCredFields(false);
  document.getElementById('cred-drawer-body').innerHTML = fields + statusField();
  document.getElementById('cred-overlay').classList.remove('hidden');
  document.getElementById('cred-drawer').classList.remove('hidden');
}
function openEditCredential() {
  document.getElementById('cred-drawer-title').textContent = '编辑凭证';
  const tmpl = credFieldTemplates[currentSourceType];
  const fields = tmpl ? tmpl(true) : defaultCredFields(true);
  document.getElementById('cred-drawer-body').innerHTML = fields + statusField();
  document.getElementById('cred-overlay').classList.remove('hidden');
  document.getElementById('cred-drawer').classList.remove('hidden');
}
function closeCredDrawer() {
  document.getElementById('cred-overlay').classList.add('hidden');
  document.getElementById('cred-drawer').classList.add('hidden');
}
</script>
</body>
</html>
