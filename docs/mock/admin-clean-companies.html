/* ============================
   国家中文映射
   ============================ */
var COUNTRY_CN = {
  "USA": "美国", "DEU": "德国", "JPN": "日本",
  "GBR": "英国", "AUS": "澳大利亚", "CAN": "加拿大",
  "FRA": "法国", "ITA": "意大利", "KOR": "韩国",
  "TWN": "台湾", "CHN": "中国", "IND": "印度",
  "MEX": "墨西哥", "BRA": "巴西", "SGP": "新加坡"
};

/* ============================
   状态
   ============================ */
var filteredData = COMPANIES.slice();
var PAGE_SIZE = 20;
var currentPage = 1;

/* ============================
   工具函数
   ============================ */
function formatUSD(n) {
  if (n === null || n === undefined) return "—";
  return "$" + n.toLocaleString("en-US");
}

function getBandLabel(band) {
  var map = {
    tiny:   "微型（≤9人）",
    small:  "小型（10-49人）",
    medium: "中型（50-499人）",
    large:  "大型（500-1999人）",
    xlarge: "超大型（2000+人）"
  };
  return map[band] || band;
}

function getBandTag(band) {
  var cfg = {
    tiny:   { cls: "tag-gray",   label: "微型" },
    small:  { cls: "tag-blue",   label: "小型" },
    medium: { cls: "tag-orange", label: "中型" },
    large:  { cls: "tag-purple", label: "大型" },
    xlarge: { cls: "tag-red",    label: "超大型" }
  };
  var c = cfg[band] || { cls: "tag-gray", label: band };
  return '<span class="tag ' + c.cls + '">' + c.label + '</span>';
}

function getFactoryTag(ft) {
  var cfg = {
    "生产制造": { cls: "tag-green",  label: "生产制造" },
    "OEM":      { cls: "tag-blue",   label: "OEM" },
    "ODM":      { cls: "tag-purple", label: "ODM" },
    "其他":     { cls: "tag-gray",   label: "其他" }
  };
  var c = cfg[ft] || { cls: "tag-gray", label: ft };
  return '<span class="tag ' + c.cls + '">' + c.label + '</span>';
}

function getPCBCell(val) {
  if (val === "yes")     return '<span class="text-green-600 font-medium">✓ 有</span>';
  if (val === "no")      return '<span class="text-red-500 font-medium">✗ 无</span>';
  return '<span class="text-slate-400">— 未知</span>';
}

function getContactLevelTag(level) {
  var cfg = {
    decision: { cls: "tag-red",    label: "决策者" },
    buyer:    { cls: "tag-orange", label: "采购" },
    tech:     { cls: "tag-blue",   label: "技术" },
    other:    { cls: "tag-gray",   label: "其他" }
  };
  var c = cfg[level] || { cls: "tag-gray", label: level };
  return '<span class="tag ' + c.cls + ' text-xs">' + c.label + '</span>';
}

/* ============================
   渲染表格
   ============================ */
function renderTable() {
  var tbody = document.getElementById("table-body");
  var start = (currentPage - 1) * PAGE_SIZE;
  var pageData = filteredData.slice(start, start + PAGE_SIZE);

  if (!filteredData.length) {
    tbody.innerHTML = "";
    document.getElementById("empty-state").classList.remove("hidden");
  } else {
    document.getElementById("empty-state").classList.add("hidden");
    tbody.innerHTML = pageData.map(function(c) {
      return '<tr>' +
        '<td>' +
          '<div class="font-medium text-slate-800">' + c.name_normalized + '</div>' +
          '<div class="text-xs text-slate-400 mt-0.5">' + c.domain + '</div>' +
        '</td>' +
        '<td class="whitespace-nowrap">' + c.country_flag + ' ' + (COUNTRY_CN[c.country_iso3] || c.country_iso3) + '</td>' +
        '<td>' + c.industry + '</td>' +
        '<td style="color:#595959;">' + (c.employee_count_raw || '—') + '</td>' +
        '<td class="text-right font-mono text-slate-700">' + formatUSD(c.import_amount_usd) + '</td>' +
        '<td>' + getFactoryTag(c.factory_type) + '</td>' +
        '<td>' + getPCBCell(c.has_china_pcb_supplier) + '</td>' +
        '<td class="text-right text-slate-700">' + c.contact_count + '</td>' +
        '<td>' + c.sources.map(function(s){ return '<span class="tag tag-blue">' + s + '</span>'; }).join(" ") + '</td>' +
        '<td>' + (c.keyword ? '<span class="tag tag-gray" style="font-size:11px;">' + c.keyword + '</span>' : '<span style="color:#bfbfbf;">—</span>') + '</td>' +
        '<td class="text-slate-500 text-sm">' + c.created_at + '</td>' +
        '<td><button class="btn btn-default btn-sm" onclick="openDrawer(' + c.id + ')">详情</button></td>' +
      '</tr>';
    }).join("");
  }

  updateStatBar();
  renderPagination();
}

function updateStatBar() {
  var totalPCB = filteredData.filter(function(c){ return c.has_china_pcb_supplier === "yes"; }).length;
  var totalContacts = filteredData.reduce(function(sum, c){ return sum + c.contact_count; }, 0);
  document.getElementById("stat-text").textContent =
    "共 " + filteredData.length + " 条 · 有供应商 " + totalPCB + " 条 · 联系人总数 " + totalContacts + " 人";
}

function renderPagination() {
  var totalPages = Math.max(1, Math.ceil(filteredData.length / PAGE_SIZE));
  function buildHtml() {
    var html = "";
    html += '<button class="page-btn" onclick="goPage(' + (currentPage - 1) + ')" ' + (currentPage <= 1 ? "disabled" : "") + '>‹</button>';
    for (var i = 1; i <= totalPages; i++) {
      if (totalPages > 7 && i > 3 && i < totalPages - 1 && Math.abs(i - currentPage) > 1) {
        if (i === 4 || i === totalPages - 2) html += '<span class="page-btn" style="border:none;background:none;cursor:default;">…</span>';
        continue;
      }
      html += '<button class="page-btn' + (i === currentPage ? " active" : "") + '" onclick="goPage(' + i + ')">' + i + '</button>';
    }
    html += '<button class="page-btn" onclick="goPage(' + (currentPage + 1) + ')" ' + (currentPage >= totalPages ? "disabled" : "") + '>›</button>';
    return html;
  }
  document.getElementById("pagination-2").innerHTML = buildHtml();
}

function goPage(p) {
  var totalPages = Math.max(1, Math.ceil(filteredData.length / PAGE_SIZE));
  if (p < 1 || p > totalPages) return;
  currentPage = p;
  renderTable();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

/* ============================
   过滤逻辑
   ============================ */
function applyFilters() {
  var search     = (document.getElementById("f-search").value || "").trim().toLowerCase();
  var country    = document.getElementById("f-country").value;
  var industry   = document.getElementById("f-industry").value;
  var keyword    = document.getElementById("f-keyword").value;
  var tag        = (document.getElementById("f-tag").value || "").trim().toLowerCase();
  var size       = document.getElementById("f-size").value;
  var amtMin     = parseFloat(document.getElementById("f-amount-min").value) || 0;
  var amtMax     = parseFloat(document.getElementById("f-amount-max").value) || 0;
  var cntMin     = parseInt(document.getElementById("f-count-min").value) || 0;
  var cntMax     = parseInt(document.getElementById("f-count-max").value) || 0;
  var pcb        = document.getElementById("f-pcb").value;
  var contactMin = parseInt(document.getElementById("f-contact-min").value) || 0;
  var contactMax = parseInt(document.getElementById("f-contact-max").value) || 0;
  var yearMin    = parseInt(document.getElementById("f-year-min").value) || 0;
  var yearMax    = parseInt(document.getElementById("f-year-max").value) || 0;

  filteredData = COMPANIES.filter(function(c) {
    if (search && !(c.name_normalized.toLowerCase().includes(search) || c.domain.toLowerCase().includes(search))) return false;
    if (country  && c.country_iso3 !== country) return false;
    if (industry && c.industry !== industry) return false;
    if (keyword  && c.keyword !== keyword) return false;
    if (tag) {
      var found = (c.product_tags || []).some(function(t){ return t.toLowerCase().includes(tag); });
      if (!found) return false;
    }
    if (size && c.employee_count_band !== size) return false;
    if (amtMin > 0 && c.import_amount_usd < amtMin) return false;
    if (amtMax > 0 && c.import_amount_usd > amtMax) return false;
    var freq = parseInt((c.import_frequency || "0").split("次")[0]) || 0;
    if (cntMin > 0 && freq < cntMin) return false;
    if (cntMax > 0 && freq > cntMax) return false;
    if (pcb && c.has_china_pcb_supplier !== pcb) return false;
    if (contactMin > 0 && c.contact_count < contactMin) return false;
    if (contactMax > 0 && c.contact_count > contactMax) return false;
    if (yearMin > 0 && c.established_year && c.established_year < yearMin) return false;
    if (yearMax > 0 && c.established_year && c.established_year > yearMax) return false;
    return true;
  });

  currentPage = 1;
  renderTable();
}

function resetFilters() {
  ["f-search","f-tag","f-amount-min","f-amount-max","f-count-min","f-count-max","f-contact-min","f-contact-max","f-year-min","f-year-max"].forEach(function(id){
    document.getElementById(id).value = "";
  });
  ["f-country","f-industry","f-keyword","f-size","f-pcb"].forEach(function(id){
    document.getElementById(id).value = "";
  });
  filteredData = COMPANIES.slice();
  currentPage = 1;
  renderTable();
}

/* ============================

  var c = COMPANIES.find(function(x){ return x.id === id; });

  var html = "";

  html += drawerField("出口频次", c.export_frequency || "—");
  html += '</div></div>';

  /* Section 3 - 产品与供应链 */
  html += '<div>';
  html += '<div class="drawer-section-title"><span class="w-1 h-4 bg-green-500 rounded-full inline-block"></span>产品与供应链</div>';
  html += '<div class="space-y-4">';
  html += '<div><div class="detail-label">产品标签</div><div class="mt-1">' +

  '</div></div>';
  html += '<div class="grid grid-cols-2 gap-x-8">';
  html += drawerField("工厂性质", getFactoryTag(c.factory_type) + '<span class="text-xs text-slate-400 ml-1.5">（LLM 推断）</span>');

  html += '<div>';
  html += '<div class="drawer-section-title"><span class="w-1 h-4 bg-orange-500 rounded-full inline-block"></span>数据与评分</div>';

  html += '</tbody></table>';
  html += '</div></div>';

  document.getElementById("drawer-body").innerHTML = html;
  document.getElementById("drawer-overlay").classList.add("open");

}

function drawerField(label, value) {
  return '<div><div class="detail-label">' + label + '</div><div class="detail-value mt-0.5">' + value + '</div></div>';
}

function getPCBDrawer(val) {
  if (val === "yes")     return '<span class="text-green-600 font-medium text-base">✓ 有</span>';
  if (val === "no")      return '<span class="text-red-500 font-medium text-base">✗ 无</span>';
  return '<span class="text-slate-400 text-base">？ 未知</span>';
}

function closeDrawer() {
  document.getElementById("drawer-overlay").classList.remove("open");
  document.getElementById("drawer-panel").classList.remove("open");
  document.body.style.overflow = "";
}

/* ============================

document.addEventListener("keydown", function(e) {
  if (e.key === "Escape") closeDrawer();
});
