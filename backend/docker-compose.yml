services:
  postgres:
    image: postgres:16-alpine
    container_name: clientget-postgres
    environment:
      POSTGRES_DB: clientget
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - clientget_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d clientget"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env.local
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/clientget
      SYNC_DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/clientget
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/clientget_test
      TEST_SYNC_DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/clientget_test
    ports:
      - "8000:8000"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  clientget_postgres_data:
