x-runtime-env: &runtime-env
  APP_ENV: ${DOCKER_APP_ENV:-production}
  DEBUG: ${DOCKER_DEBUG:-false}
  DATABASE_URL: ${DOCKER_DATABASE_URL:-postgresql+asyncpg://postgres:postgres@postgres:5432/clientget}
  SYNC_DATABASE_URL: ${DOCKER_SYNC_DATABASE_URL:-postgresql+psycopg://postgres:postgres@postgres:5432/clientget}

services:
  backend:
    restart: unless-stopped
    environment: *runtime-env
    command: python -m uvicorn app.main:app --host 0.0.0.0 --port 8000
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')\""]
      interval: 15s
      timeout: 5s
      retries: 10

  scoring-worker:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment: *runtime-env
    restart: unless-stopped
    command: python scripts/run_scoring_worker.py --sleep-seconds 10

  collection-scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment: *runtime-env
    restart: unless-stopped
    command: python scripts/run_collection_scheduler_worker.py --sleep-seconds ${COLLECTION_SCHEDULER_SLEEP_SECONDS:-30}

  collection-worker:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment: *runtime-env
    restart: unless-stopped
    command: >
      python scripts/run_collection_worker.py
      --sleep-seconds ${COLLECTION_WORKER_SLEEP_SECONDS:-10}
      --lease-seconds ${COLLECTION_TASK_LEASE_SECONDS:-300}
      --limit ${COLLECTION_WORKER_LIMIT:-20}
      --heartbeat-interval-seconds ${COLLECTION_HEARTBEAT_INTERVAL_SECONDS:-30}

  sending-worker:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment: *runtime-env
    restart: unless-stopped
    command: python scripts/run_sending_worker.py --sleep-seconds 10
