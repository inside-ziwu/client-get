name: 构建并推送到阿里云 ACR

on:
  workflow_dispatch:
    inputs:
      service:
        description: '要构建的服务'
        required: true
        type: choice
        options:
          - admin
          - tenant
          - backend
      tag:
        description: '镜像 tag（留空则自动递增 YYYY.MM.DD-rN）'
        required: false
        type: string
      api_url:
        description: '前端指向的后端 API 地址（仅 admin/tenant 生效；留空用 Instance A 默认值）'
        required: false
        type: string
        default: 'https://api.xinanpcb.com'
      tenant_portal_url:
        description: '租户端入口地址（仅 admin 生效，用于「后台管理地址」展示；留空用 Instance A 默认值）'
        required: false
        type: string
        default: ''

env:
  REGISTRY: crpi-q6fqloatvalw3jr2.cn-beijing.personal.cr.aliyuncs.com

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录阿里云 ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: 生成镜像 tag
        id: meta
        run: |
          REPO="${{ env.REGISTRY }}/lay_inside/clientget-${{ inputs.service }}"
          if [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          else
            DATE="$(date -u +%Y.%m.%d)"
            REV=1
            while docker manifest inspect "${REPO}:${DATE}-r${REV}" > /dev/null 2>&1; do
              REV=$((REV + 1))
            done
            TAG="${DATE}-r${REV}"
          fi
          IMAGE="${REPO}:${TAG}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "▶ 构建目标: ${IMAGE}"

      - name: 构建并推送镜像
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.service == 'backend' && 'backend' || 'frontend' }}
          file: ${{ inputs.service == 'backend' && 'backend/Dockerfile' || format('frontend/Dockerfile.{0}', inputs.service) }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            ${{ inputs.service == 'admin' && format('NEXT_PUBLIC_ADMIN_API_BASE_URL={0}', inputs.api_url || 'https://api.xinanpcb.com') || '' }}
            ${{ inputs.service == 'admin' && format('NEXT_PUBLIC_TENANT_PORTAL_BASE_URL={0}', inputs.tenant_portal_url) || '' }}
            ${{ inputs.service == 'tenant' && format('NEXT_PUBLIC_API_BASE_URL={0}', inputs.api_url || 'https://api.xinanpcb.com') || '' }}

      - name: 输出结果
        run: |
          echo ""
          echo "✅ 推送完成: ${{ steps.meta.outputs.image }}"
          echo ""
          echo "Sealos 更新镜像 tag 为:"
          echo "  ${{ steps.meta.outputs.tag }}"
