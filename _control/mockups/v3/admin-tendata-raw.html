// ===========================
// 状态
// ===========================
var filteredData = COMPANIES.slice();
var PAGE_SIZE = 20;
var currentPage = 1;

// ===========================
// 工具函数
// ===========================
function formatUSD(n) {
  if (!n || n === 0) return '—';
  if (n >= 1000000) return '$' + (n / 1000000).toFixed(1) + 'M';
  if (n >= 1000) return '$' + Math.round(n / 1000) + 'K';
  return '$' + n;
}

function getBirthYear(date) {
  if (!date) return '—';
  return date.substring(0, 4);
}

function sizeBand(emp) {
  if (!emp) return '—';
  if (emp < 10)   return '微型';
  if (emp < 50)   return '小型';
  if (emp < 500)  return '中型';
  if (emp < 2000) return '大型';
  return '超大型';
}

function sizeKey(emp) {
  if (!emp) return '';
  if (emp < 10)   return 'micro';
  if (emp < 50)   return 'small';
  if (emp < 500)  return 'medium';
  if (emp < 2000) return 'large';
  return 'xlarge';
}

function impBadge(lv) {
  if (lv === 1) return '<span class="badge badge-red">关键</span>';
  if (lv === 2) return '<span class="badge badge-orange">一般</span>';
  return '<span class="badge badge-gray">普通</span>';
}

function verIcon(v) {
  return v ? '<span style="color:#52c41a;">✓</span>' : '<span style="color:#d9d9d9;">✗</span>';
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ===========================
// 渲染表格
// ===========================
function renderTable() {
  var tbody = document.getElementById('table-body');
  var start = (currentPage - 1) * PAGE_SIZE;
  var pageData = filteredData.slice(start, start + PAGE_SIZE);

  if (!pageData.length) {
    tbody.innerHTML = '<tr><td colspan="15" style="text-align:center;color:#8c8c8c;padding:40px 0;">暂无匹配数据</td></tr>';
    updateStatBar();
    renderPagination();
    return;
  }

  var html = '';
  pageData.forEach(function(c) {
    var tagsHtml = '';
    var showTags = c.product_tags.slice(0, 2);
    var more = c.product_tags.length - 2;
    showTags.forEach(function(t) {
      tagsHtml += '<span class="chip chip-blue" style="font-size:11px;">' + escHtml(t) + '</span>';
    });
    if (more > 0) tagsHtml += '<span class="chip chip-gray" style="font-size:11px;">+' + more + '</span>';

    var industryShort = c.industry_desc.length > 22 ? c.industry_desc.substring(0, 20) + '…' : c.industry_desc;
    var websiteShort  = c.website.length > 20 ? c.website.substring(0, 18) + '…' : c.website;

    html += '<tr>';
    html += '<td><span style="font-weight:500;color:#000000d9;">' + escHtml(c.name) + '</span></td>';
    html += '<td><span style="font-size:14px;">' + c.flag + '</span> <span style="font-size:12px;color:#595959;">' + c.country_iso3 + '</span></td>';
    html += '<td><span class="tt" style="color:#595959;">' + escHtml(industryShort) + '<span class="tt-box">' + escHtml(c.industry_desc) + '</span></span></td>';
    html += '<td>' + tagsHtml + '</td>';
    html += '<td class="num-col">' + (c.employee_num ? c.employee_num.toLocaleString() : '—') + '<br><span style="font-size:11px;color:#8c8c8c;">' + sizeBand(c.employee_num) + '</span></td>';
    html += '<td><a href="https://' + escHtml(c.website) + '" target="_blank" style="color:#1677ff;text-decoration:none;font-size:12px;" title="' + escHtml(c.website) + '">' + escHtml(websiteShort) + '</a></td>';
    html += '<td class="num-col" style="color:#000000d9;">' + formatUSD(c.trade_amount_3y_usd) + '</td>';
    html += '<td class="num-col">' + (c.trade_count || '—') + '</td>';
    html += '<td class="num-col">' + c.contacts_count + '</td>';
    html += '<td class="num-col">' + getBirthYear(c.incorporation_date) + '</td>';
    html += '<td class="num-col">' + (c.pcb_suppliers.length || '—') + '</td>';
    var methodBadge = c.collection_method === '直采'
      ? '<span class="badge badge-blue">直采</span>'
      : '<span class="badge badge-green">反推</span>';
    html += '<td>' + methodBadge + '</td>';
    html += '<td>' + (c.keyword ? '<span class="chip chip-gray" style="font-size:11px;">' + escHtml(c.keyword) + '</span>' : '<span style="color:#bfbfbf;">—</span>') + '</td>';
    html += '<td style="color:#595959;font-size:12px;">' + c.last_seen_at + '</td>';
    html += '<td><button class="btn btn-default btn-sm" onclick="openDrawer(' + c.id + ')">详情</button></td>';
    html += '</tr>';
  });
  tbody.innerHTML = html;
  updateStatBar();
  renderPagination();
}

// ===========================
// 统计条
// ===========================
function updateStatBar() {
  var total = filteredData.length;
  var withTrade = filteredData.filter(function(c) { return c.trade_amount_3y_usd > 0; }).length;
  var totalContacts = filteredData.reduce(function(sum, c) { return sum + c.contacts_count; }, 0);
  var text = '共 ' + total + ' 条 · 有贸易额 ' + withTrade + ' 条 · 联系人总数 ' + totalContacts + ' 人';
  document.getElementById('stat-text').textContent = text;
}

// ===========================
// 分页
// ===========================
function renderPagination() {
  var totalPages = Math.max(1, Math.ceil(filteredData.length / PAGE_SIZE));
  function buildHtml(paginationId) {
    var html = '';
    html += '<button class="page-btn" onclick="goPage(' + (currentPage - 1) + ',\'' + paginationId + '\')" ' + (currentPage <= 1 ? 'disabled' : '') + '>‹</button>';
    for (var i = 1; i <= totalPages; i++) {
      if (totalPages > 7 && i > 3 && i < totalPages - 1 && Math.abs(i - currentPage) > 1) {
        if (i === 4 || i === totalPages - 2) html += '<span class="page-btn" style="border:none;background:none;cursor:default;">…</span>';
        continue;
      }
      html += '<button class="page-btn' + (i === currentPage ? ' active' : '') + '" onclick="goPage(' + i + ',\'' + paginationId + '\')">' + i + '</button>';
    }
    html += '<button class="page-btn" onclick="goPage(' + (currentPage + 1) + ',\'' + paginationId + '\')" ' + (currentPage >= totalPages ? 'disabled' : '') + '>›</button>';
    return html;
  }
  document.getElementById('pagination-2').innerHTML = buildHtml('pagination-2');
}

function goPage(p, src) {
  var totalPages = Math.max(1, Math.ceil(filteredData.length / PAGE_SIZE));
  if (p < 1 || p > totalPages) return;
  currentPage = p;
  renderTable();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// ===========================
// 过滤
// ===========================
function applyFilters() {
  var kw         = (document.getElementById('f-search').value || '').trim().toLowerCase();
  var country    = document.getElementById('f-country').value;
  var industry   = (document.getElementById('f-industry').value || '').trim().toLowerCase();
  var keyword    = document.getElementById('f-keyword').value;
  var tag        = (document.getElementById('f-tag').value || '').trim().toLowerCase();
  var size       = document.getElementById('f-size').value;
  var amtMin     = parseFloat(document.getElementById('f-amount-min').value) || 0;
  var amtMax     = parseFloat(document.getElementById('f-amount-max').value) || 0;
  var cntMin     = parseInt(document.getElementById('f-count-min').value) || 0;
  var cntMax     = parseInt(document.getElementById('f-count-max').value) || 0;
  var pcb        = document.getElementById('f-pcb').value;
  var contactMin = parseInt(document.getElementById('f-contact-min').value) || 0;
  var contactMax = parseInt(document.getElementById('f-contact-max').value) || 0;
  var yearMin    = parseInt(document.getElementById('f-year-min').value) || 0;
  var yearMax    = parseInt(document.getElementById('f-year-max').value) || 0;
  var method     = document.getElementById('f-method').value;

  filteredData = COMPANIES.filter(function(c) {
    if (kw && c.name.toLowerCase().indexOf(kw) < 0 && c.website.toLowerCase().indexOf(kw) < 0) return false;
    if (country && c.country_iso3 !== country) return false;
    if (industry && c.industry_desc.toLowerCase().indexOf(industry) < 0) return false;
    if (keyword && c.keyword !== keyword) return false;
    if (tag) {
      var found = c.product_tags.some(function(t) { return t.toLowerCase().indexOf(tag) >= 0; });
      if (!found) return false;
    }
    if (size && sizeKey(c.employee_num) !== size) return false;
    if (amtMin > 0 && c.trade_amount_3y_usd < amtMin) return false;
    if (amtMax > 0 && c.trade_amount_3y_usd > amtMax) return false;
    if (cntMin > 0 && c.trade_count < cntMin) return false;
    if (cntMax > 0 && c.trade_count > cntMax) return false;
    if (pcb === 'yes' && c.pcb_suppliers.length === 0) return false;
    if (pcb === 'no'  && c.pcb_suppliers.length > 0)  return false;
    if (contactMin > 0 && c.contacts_count < contactMin) return false;
    if (contactMax > 0 && c.contacts_count > contactMax) return false;
    if (c.incorporation_date) {
      var yr = parseInt(c.incorporation_date.substring(0, 4));
      if (yearMin > 0 && yr < yearMin) return false;
      if (yearMax > 0 && yr > yearMax) return false;
    }
    if (method && c.collection_method !== method) return false;
    return true;
  });
  currentPage = 1;
  renderTable();
}

function resetFilters() {
  ['f-search','f-industry','f-tag',
   'f-amount-min','f-amount-max',
   'f-count-min','f-count-max',
   'f-contact-min','f-contact-max',
   'f-year-min','f-year-max'].forEach(function(id) {
    document.getElementById(id).value = '';
  });
  ['f-country','f-keyword','f-size','f-pcb','f-method'].forEach(function(id) {
    document.getElementById(id).value = '';
  });
  filteredData = COMPANIES.slice();
  currentPage = 1;
  renderTable();
}

// ===========================
// Drawer
// ===========================
function openDrawer(id) {
  var c = COMPANIES.find(function(x) { return x.id === id; });
  if (!c) return;

  document.getElementById('drawer-title').textContent = c.name;
  document.getElementById('drawer-subtitle').textContent = c.flag + ' ' + c.country_iso3 + '  ·  更新于 ' + c.last_seen_at;

  var contactList = CONTACTS[id] || [];
  var contactRows = contactList.map(function(ct) {
    return '<tr>' +
      '<td style="font-weight:500;">' + escHtml(ct.name) + '</td>' +
      '<td style="color:#595959;font-size:13px;">' + escHtml(ct.title) + '</td>' +
      '<td><a href="mailto:' + escHtml(ct.email) + '" style="color:#1677ff;text-decoration:none;font-size:13px;">' + escHtml(ct.email) + '</a></td>' +
      '<td>' + impBadge(ct.importance) + '</td>' +
      '<td style="text-align:center;">' + verIcon(ct.verified) + '</td>' +
      '</tr>';
  }).join('') || '<tr><td colspan="5" style="text-align:center;color:#8c8c8c;padding:16px;">暂无联系人</td></tr>';

  var tagsHtml = c.product_tags.map(function(t) {
    return '<span class="chip chip-blue">' + escHtml(t) + '</span>';
  }).join('') || '<span style="color:#8c8c8c;">—</span>';

  var supplHtml = (c.pcb_suppliers || []).map(function(s) {
    return '<span class="chip chip-gray">' + escHtml(s) + '</span>';
  }).join('') || '<span style="color:#8c8c8c;">—</span>';

  function field(label, value) {
    return '<div><div class="detail-label">' + label + '</div><div class="detail-value">' + value + '</div></div>';
  }
  function sectionTitle(t) {
    return '<div class="drawer-section-title">' + t + '</div>';
  }

  var html = '';

  // Section 1: 基本信息
  html += '<div style="margin-bottom:20px;">' + sectionTitle('基本信息');
  html += '<div style="display:grid;grid-template-columns:1fr 1fr;gap:14px 24px;">';
  html += field('腾道ID (tid)', escHtml(c.tid));
  html += field('全球商业ID (globiz_id)', escHtml(c.globiz_id));
  html += field('国家', c.flag + ' ' + c.country_iso3);
  html += field('官网', '<a href="https://' + escHtml(c.website) + '" target="_blank" style="color:#1677ff;text-decoration:none;">' + escHtml(c.website) + '</a>');
  html += field('税号', escHtml(c.tax_no));
  html += field('成立时间', c.incorporation_date || '—');
  html += field('别名', c.aliases ? escHtml(c.aliases) : '—');
  html += field('数据来源', '<span class="badge badge-blue">腾道</span>');
  var methodDisplay = c.collection_method === '直采' ? '<span class="badge badge-blue">直采</span>' : '<span class="badge badge-green">反推</span>';
  html += field('采集方式', methodDisplay);
  html += '</div>';
  html += '<div style="margin-top:12px;">' + field('细分行业', '<span style="color:#595959;">' + escHtml(c.industry_desc) + '</span>') + '</div>';
  html += '</div>';

  // Section 2: 规模与贸易
  html += '<div style="margin-bottom:20px;">' + sectionTitle('规模与贸易');
  html += '<div style="display:grid;grid-template-columns:1fr 1fr;gap:14px 24px;">';
  html += field('员工数', c.employee_num ? c.employee_num.toLocaleString() + ' 人（' + sizeBand(c.employee_num) + '）' : '—');
  html += field('进口额（3年，vot接口）', formatUSD(c.trade_amount_3y_usd));
  html += field('进口次数（3年）', c.trade_count ? c.trade_count + ' 次' : '—');
  html += field('进/出口分开统计', '<span style="color:#8c8c8c;font-size:13px;">当前实现未拆分，出口方向数据见干净公司库</span>');
  html += '</div></div>';

  // Section 3: 产品与供应商
  html += '<div style="margin-bottom:20px;">' + sectionTitle('产品与供应链');
  html += '<div style="margin-bottom:10px;"><div class="detail-label">产品标签 (product_tags)</div><div style="margin-top:4px;">' + tagsHtml + '</div></div>';
  html += '<div><div class="detail-label">PCB供应商 (pcb_suppliers) — 来自贸易记录出口方</div><div style="margin-top:4px;">' + supplHtml + '</div></div>';
  html += '</div>';

  // Section 4: 联系人
  html += '<div>' + sectionTitle('关联联系人（' + contactList.length + ' 人）');
  html += '<div style="border:1px solid #f0f0f0;border-radius:6px;overflow:hidden;">';
  html += '<table style="table-layout:fixed;"><thead><tr>' +
    '<th style="width:120px;">姓名</th><th style="width:160px;">职位</th><th>邮箱</th><th style="width:60px;">重要度</th><th style="width:60px;text-align:center;">验证</th>' +
    '</tr></thead><tbody>' + contactRows + '</tbody></table>';
  html += '</div></div>';

  document.getElementById('drawer-body').innerHTML = html;
  document.getElementById('drawer-overlay').classList.add('open');
  document.getElementById('drawer-panel').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeDrawer() {
  document.getElementById('drawer-overlay').classList.remove('open');
  document.getElementById('drawer-panel').classList.remove('open');
  document.body.style.overflow = '';
}

// ESC 关闭
document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') closeDrawer();
});

filteredData = COMPANIES.slice();
renderTable();
